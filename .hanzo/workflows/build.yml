name: Build image

# Builds + pushes ghcr.io/hanzoai/waitlist on a v* semver tag via the canonical
# reusable workflow, on the git-runner fleet at git.hanzo.ai. Semver-only tags.
# (The arcd pool this used to name was retired 2026-08-01; the reusable's
# runner defaults already point at the fleet labels.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/waitlist
    secrets: inherit
